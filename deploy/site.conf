# nginx do site Alemão (contêiner "site"). Mudanças aqui só valem depois de reiniciar o projeto no hPanel.
server_tokens off;

server {
    listen 80;
    server_name _;
    root /srv/repo/public;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Endereço principal com www (o certificado cobre os dois)
    if ($host = "alemaoafiacao.com.br") {
        return 301 https://www.alemaoafiacao.com.br$request_uri;
    }

    # Cabeçalhos de segurança
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # Atalhos do link na bio (Instagram)
    location = /links     { return 301 /links/; }
    location = /instagram { return 301 /links/; }
    location = /bio       { return 301 /links/; }

    # Arquivos com versão (?v=) e mídia: cache longo. "expires" não apaga os cabeçalhos acima.
    location ~* \.(css|js|woff|woff2)$ {
        expires 30d;
        try_files $uri =404;
    }
    location ~* \.(webp|png|jpg|jpeg|svg|ico|pdf|mp4)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
