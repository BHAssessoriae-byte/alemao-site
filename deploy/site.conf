server {
    listen 80;
    server_name _;
    root /srv/repo/public;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Até o site (Entrega 2) entrar no ar, a raiz leva para o link na bio
    location = / { return 302 /links/; }
    location = /links { return 301 /links/; }

    location ~* \.(webp|png|jpg|jpeg|svg|ico|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
